# nginx site for CallEnvoy at the root of its own host. Replace callenvoy.example.com (4 places) and get the
# certificate first (certbot certonly --webroot -w /var/www/certbot -d callenvoy.example.com).
# Needs once, in the http block: map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
    listen 80;
    listen [::]:80;
    server_name callenvoy.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name callenvoy.example.com;
    ssl_certificate /etc/letsencrypt/live/callenvoy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callenvoy.example.com/privkey.pem;
    client_max_body_size 1M;

    # Optional: anonymous visit counts through a self-hosted Umami on this machine (see client/src/platform/analytics.web.ts).
    # location /u/ {
    #     proxy_pass http://127.0.0.1:3030/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    # }

    # An agent key can be in this path: keep it out of the access log, and out of the error log (nginx writes
    # the request line there when the service is down, for example during a restart).
    location ~ ^/mcp/. {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # the per-IP sign-in limit reads this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;  # the call audio and Twilio streams are WebSockets
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
