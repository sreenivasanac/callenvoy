<!doctype html>
<!-- Source of public/og.png (the link preview, 1200 x 630) and, with ?icon, of the app icon (1024 x 1024).
     Make the files again with dev/make-images.sh after a change here. Colours: palette.light in src/theme.ts. -->
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url(../public/fonts/bricolage-grotesque.woff2) format('woff2'); font-weight: 400 800; }
  @font-face { font-family: 'Instrument Sans'; src: url(../public/fonts/instrument-sans.woff2) format('woff2'); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #F7F3EC; color: #1A1F2B; font-family: 'Instrument Sans', sans-serif; padding: 64px 72px; display: flex; flex-direction: column; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 34px 'Bricolage Grotesque'; letter-spacing: -0.5px; }
  .mark { width: 34px; height: 34px; border-radius: 50%; border: 5px solid #2A3BD8; display: grid; place-items: center; }
  .mark i { width: 10px; height: 10px; border-radius: 50%; background: #2A3BD8; }
  h1 { font: 800 92px/0.98 'Bricolage Grotesque'; letter-spacing: -3px; margin-top: 58px; max-width: 900px; }
  p { font-size: 30px; color: #39404E; margin-top: 26px; }
  .line { margin-top: auto; display: flex; }
  .stop { flex: 1; text-align: center; font-size: 24px; color: #5C6370; }
  .rail { display: flex; align-items: center; height: 36px; margin-bottom: 10px; }
  .wire { flex: 1; height: 4px; background: #E4DDD1; }
  .wire.done { background: #1A1F2B; }
  .wire.none { background: transparent; }
  .knob { width: 20px; height: 20px; border-radius: 50%; border: 4px solid #8F867A; background: #fff; }
  .knob.done { background: #1A1F2B; border-color: #1A1F2B; }
  .knob.now { width: 34px; height: 34px; background: #1C7C4A; border-color: #1C7C4A; }
  .stop.now { color: #1A1F2B; font-weight: 700; }
  /* ?icon: the mark alone on the accent, 1024 x 1024 */
  body.icon { width: 1024px; height: 1024px; padding: 0; background: #2A3BD8; display: grid; place-items: center; }
  body.icon > * { display: none; }
  body.icon .big { display: grid; width: 560px; height: 560px; border-radius: 50%; border: 96px solid #F7F3EC; place-items: center; }
  body.icon .big i { width: 150px; height: 150px; border-radius: 50%; background: #F7F3EC; display: block; }
  .big { display: none; }
</style>
<body>
  <div class="brand"><span class="mark"><i></i></span>CallEnvoy</div>
  <h1>An AI that makes your phone calls</h1>
  <p>It handles the menu and the hold. Listen in or take over at any time.</p>
  <div class="line">
    <div class="stop"><div class="rail"><span class="wire none"></span><span class="knob done"></span><span class="wire done"></span></div>Dialing</div>
    <div class="stop"><div class="rail"><span class="wire done"></span><span class="knob done"></span><span class="wire done"></span></div>Menu</div>
    <div class="stop"><div class="rail"><span class="wire done"></span><span class="knob done"></span><span class="wire done"></span></div>Hold</div>
    <div class="stop now"><div class="rail"><span class="wire done"></span><span class="knob now"></span><span class="wire"></span></div>Talking</div>
    <div class="stop"><div class="rail"><span class="wire"></span><span class="knob"></span><span class="wire none"></span></div>Done</div>
  </div>
  <div class="big"><i></i></div>
  <script>if (location.search.includes('icon')) document.body.className = 'icon';</script>
</body>
