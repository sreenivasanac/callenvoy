<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Page colours before the script loads (the same as palette.light.bg / palette.dark.bg in src/theme.ts). -->
    <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="CallEnvoy is an AI that makes phone calls for you. It gets through the phone menu, waits on hold, talks to the person, and tells you the result. Listen in or take over at any time." />
    <!-- Link preview (LinkedIn, Slack, X). The image is public/og.png, 1200 x 630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CallEnvoy" />
    <meta property="og:title" content="CallEnvoy: an AI that makes your phone calls" />
    <meta property="og:description" content="It gets through the phone menu, waits on hold, and talks to the person. Listen in or take over at any time. Open source; real calls run on your own Twilio and OpenAI keys." />
    <meta property="og:url" content="https://callenvoy.pragnyalabs.com/" />
    <meta property="og:image" content="https://callenvoy.pragnyalabs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CallEnvoy: an AI that makes your phone calls. Menu, hold, person, done." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CallEnvoy: an AI that makes your phone calls" />
    <meta name="twitter:description" content="It gets through the phone menu, waits on hold, and talks to the person. Listen in or take over at any time." />
    <meta name="twitter:image" content="https://callenvoy.pragnyalabs.com/og.png" />
    <link rel="canonical" href="https://callenvoy.pragnyalabs.com/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <style id="expo-reset">
      /* The two typefaces (font.display and font.body in src/theme.ts). Open Font License, see /fonts/LICENSE.txt. */
      @font-face { font-family: 'Bricolage Grotesque'; src: url(/fonts/bricolage-grotesque.woff2) format('woff2'); font-weight: 400 800; font-display: swap; }
      @font-face { font-family: 'Instrument Sans'; src: url(/fonts/instrument-sans.woff2) format('woff2'); font-weight: 400 700; font-display: swap; }
      :root { color-scheme: light dark; }
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #F7F3EC; }
      @media (prefers-color-scheme: dark) { body { background: #151412; } }
      #root { display: flex; height: 100%; flex: 1; }
      /* The body face for every element that does not name a face itself (react-native-web sets the system
         font on each text; its own font-family classes are named r-fontFamily-...). */
      #root :not([class*="r-fontFamily"]), body { font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      /* Visible keyboard focus for every control (the accent, var(--brand) from theme.ts). */
      :focus-visible, input:focus, textarea:focus { outline: 2px solid var(--brand, #2A3BD8) !important; outline-offset: 2px; }
      ::selection { background: var(--selected, #E3E7FD); }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
